<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      YoAmoPython · Aprende Python, SQL y Análisis de Datos desde Cero
    </title>
    <meta
      name="description"
      content="Plataforma educativa gratuita de Rodrigo González Doldán. Python, SQL y data analysis desde cero con IDE interactivo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
      :root {
        --bg: #090c14;
        --bg2: #0f1521;
        --bg3: #171f2e;
        --bg4: #1c2538;
        --accent: #f0a830;
        --accent2: #f7c948;
        --accentD: rgba(240, 168, 48, 0.1);
        --green: #22c55e;
        --greenD: rgba(34, 197, 94, 0.1);
        --red: #ef4444;
        --redD: rgba(239, 68, 68, 0.1);
        --blue: #38bdf8;
        --blueD: rgba(56, 189, 248, 0.1);
        --purple: #c084fc;
        --purpleD: rgba(192, 132, 252, 0.08);
        --t1: #f1f5f9;
        --t2: #94a3b8;
        --t3: #64748b;
        --b1: #1e293b;
        --b2: #334155;
        --ff: "DM Sans", sans-serif;
        --fm: "JetBrains Mono", monospace;
        --fs: "Fraunces", Georgia, serif;
        --sidebar: 290px;
        --topbar: 56px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--ff);
        background: var(--bg);
        color: var(--t1);
        line-height: 1.75;
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--b2);
        border-radius: 3px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--topbar);
        background: rgba(9, 12, 20, 0.94);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--b1);
        display: flex;
        align-items: center;
        padding: 0 20px;
        z-index: 100;
        gap: 12px;
      }
      .topbar-brand {
        font-family: var(--fs);
        font-weight: 800;
        font-size: 1.05rem;
        color: var(--accent);
        white-space: nowrap;
      }
      .topbar-brand span {
        color: var(--t2);
        font-weight: 400;
        font-size: 0.85rem;
      }
      .topbar-pbar {
        flex: 1;
        max-width: 240px;
        height: 4px;
        background: var(--b1);
        border-radius: 2px;
        overflow: hidden;
      }
      .topbar-pfill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--green));
        border-radius: 2px;
        transition: width 0.5s;
      }
      .topbar-stat {
        font-family: var(--fm);
        font-size: 0.7rem;
        color: var(--t3);
        white-space: nowrap;
      }
      .ham {
        display: none;
        background: 0;
        border: 0;
        color: var(--t1);
        font-size: 1.4rem;
        cursor: pointer;
      }
      .sidebar {
        position: fixed;
        top: var(--topbar);
        left: 0;
        width: var(--sidebar);
        height: calc(100vh - var(--topbar));
        background: var(--bg2);
        border-right: 1px solid var(--b1);
        overflow-y: auto;
        z-index: 90;
        padding: 16px 0;
        transition: transform 0.3s;
      }
      .sb-home {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        margin-bottom: 8px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--t2);
        cursor: pointer;
        transition: color 0.2s;
      }
      .sb-home:hover {
        color: var(--accent);
      }
      .sb-sec {
        padding: 0 12px;
        margin-bottom: 4px;
      }
      .sb-sec-t {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--t3);
        padding: 12px 8px 4px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 0.78rem;
        color: var(--t2);
        transition: all 0.15s;
        line-height: 1.3;
      }
      .sb-item:hover {
        background: var(--accentD);
        color: var(--t1);
      }
      .sb-item.act {
        background: var(--accentD);
        color: var(--accent);
        font-weight: 600;
      }
      .sb-num {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid var(--b2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
        font-weight: 600;
        flex-shrink: 0;
        font-family: var(--fm);
      }
      .sb-item.act .sb-num {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sb-item.done .sb-num {
        border-color: var(--green);
        background: var(--greenD);
        color: var(--green);
      }
      .sb-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 89;
      }
      .sb-overlay.on {
        display: block;
      }
      .main {
        margin-left: var(--sidebar);
        margin-top: var(--topbar);
        min-height: calc(100vh - var(--topbar));
      }
      .land {
        padding: 64px 40px;
        max-width: 960px;
        margin: 0 auto;
      }
      .land-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--accentD);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
        padding: 5px 14px;
        border-radius: 100px;
        border: 1px solid rgba(240, 168, 48, 0.18);
        margin-bottom: 20px;
        letter-spacing: 0.5px;
      }
      .land h1 {
        font-family: var(--fs);
        font-size: clamp(2.2rem, 4.5vw, 3.4rem);
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -1.5px;
        margin-bottom: 16px;
      }
      .land h1 em {
        font-style: normal;
        background: linear-gradient(135deg, var(--accent), #f97316);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .land > p {
        font-size: 1.05rem;
        color: var(--t2);
        max-width: 620px;
        margin-bottom: 36px;
      }
      .tracks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }
      .tcard {
        background: var(--bg3);
        border: 1px solid var(--b1);
        border-radius: 14px;
        padding: 24px;
        cursor: pointer;
        transition: all 0.25s;
        position: relative;
        overflow: hidden;
      }
      .tcard:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(240, 168, 48, 0.06);
      }
      .tcard::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
      }
      .tcard.py::before {
        background: linear-gradient(90deg, var(--blue), #06b6d4);
      }
      .tcard.da::before {
        background: linear-gradient(90deg, var(--accent), #f97316);
      }
      .tcard.sq::before {
        background: linear-gradient(90deg, var(--green), #34d399);
      }
      .tcard h3 {
        font-family: var(--fs);
        font-weight: 700;
        font-size: 1.05rem;
        margin: 8px 0;
      }
      .tcard p {
        font-size: 0.85rem;
        color: var(--t2);
        line-height: 1.55;
      }
      .tcard .tm {
        font-family: var(--fm);
        font-size: 0.65rem;
        color: var(--t3);
        margin-top: 12px;
        display: flex;
        gap: 14px;
      }
      .land-author {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px;
        background: var(--bg3);
        border-radius: 14px;
        border: 1px solid var(--b1);
      }
      .land-av {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #f97316);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--fs);
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--bg);
        flex-shrink: 0;
      }
      .land-ai h4 {
        font-family: var(--fs);
        font-weight: 600;
        font-size: 0.9rem;
      }
      .land-ai p {
        font-size: 0.78rem;
        color: var(--t2);
      }
      .land-links {
        display: flex;
        gap: 10px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .land-links a {
        font-family: var(--fm);
        font-size: 0.65rem;
        color: var(--accent);
      }
      .les {
        padding: 40px;
        max-width: 820px;
        margin: 0 auto;
      }
      .les-hdr {
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--b1);
      }
      .les-track {
        font-family: var(--fm);
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 6px;
      }
      .les-track.py {
        color: var(--blue);
      }
      .les-track.da {
        color: var(--accent);
      }
      .les-track.sq {
        color: var(--green);
      }
      .les h1 {
        font-family: var(--fs);
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.8px;
        margin-bottom: 4px;
      }
      .les-sub {
        color: var(--t2);
        font-size: 0.92rem;
      }
      .cb-h2 {
        font-family: var(--fs);
        font-size: 1.3rem;
        font-weight: 700;
        margin: 32px 0 12px;
        padding-top: 16px;
        border-top: 1px solid var(--b1);
      }
      .cb-h3 {
        font-family: var(--fs);
        font-size: 1.05rem;
        font-weight: 700;
        margin: 24px 0 8px;
        color: var(--accent2);
      }
      .cb-p {
        font-size: 0.92rem;
        color: var(--t2);
        line-height: 1.85;
        margin: 10px 0;
      }
      .cb-p strong,
      .cb-p b {
        color: var(--t1);
        font-weight: 600;
      }
      .cb-p code {
        font-family: var(--fm);
        font-size: 0.8rem;
        background: var(--bg4);
        padding: 2px 6px;
        border-radius: 3px;
        color: var(--accent);
        border: 1px solid var(--b1);
      }
      .cb-ul {
        margin: 8px 0 8px 20px;
        font-size: 0.9rem;
        color: var(--t2);
        line-height: 1.8;
      }
      .cb-ul li {
        margin-bottom: 4px;
      }
      .cb-ul b {
        color: var(--t1);
      }
      .concept {
        background: var(--bg3);
        border: 1px solid var(--b1);
        border-left: 3px solid var(--accent);
        border-radius: 0 10px 10px 0;
        padding: 20px 24px;
        margin: 22px 0;
      }
      .concept h4 {
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .concept p {
        color: var(--t2);
        font-size: 0.88rem;
        line-height: 1.75;
      }
      .analogy {
        background: var(--blueD);
        border: 1px solid rgba(56, 189, 248, 0.18);
        border-radius: 10px;
        padding: 18px 22px;
        margin: 20px 0;
      }
      .analogy h4 {
        font-weight: 600;
        font-size: 0.84rem;
        color: var(--blue);
        margin-bottom: 6px;
      }
      .analogy p {
        font-size: 0.86rem;
        color: var(--t2);
        line-height: 1.7;
      }
      .tip {
        background: var(--purpleD);
        border: 1px solid rgba(192, 132, 252, 0.18);
        border-radius: 10px;
        padding: 16px 20px;
        margin: 18px 0;
      }
      .tip h4 {
        font-weight: 600;
        font-size: 0.84rem;
        color: var(--purple);
        margin-bottom: 6px;
      }
      .tip p {
        font-size: 0.84rem;
        color: var(--t2);
        line-height: 1.6;
      }
      .warning {
        background: var(--redD);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 10px;
        padding: 16px 20px;
        margin: 18px 0;
      }
      .warning h4 {
        font-weight: 600;
        font-size: 0.84rem;
        color: var(--red);
        margin-bottom: 6px;
      }
      .warning p {
        font-size: 0.84rem;
        color: var(--t2);
        line-height: 1.6;
      }
      .realworld {
        background: var(--greenD);
        border: 1px solid rgba(34, 197, 94, 0.18);
        border-radius: 10px;
        padding: 16px 20px;
        margin: 18px 0;
      }
      .realworld h4 {
        font-weight: 600;
        font-size: 0.84rem;
        color: var(--green);
        margin-bottom: 6px;
      }
      .realworld p {
        font-size: 0.84rem;
        color: var(--t2);
        line-height: 1.6;
      }
      .edc {
        background: #0b0f18;
        border: 1px solid var(--b1);
        border-radius: 10px;
        overflow: hidden;
        margin: 20px 0;
      }
      .ed-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.015);
        border-bottom: 1px solid var(--b1);
      }
      .ed-hd-l {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ed-dots {
        display: flex;
        gap: 5px;
      }
      .ed-dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .ed-dots span:nth-child(1) {
        background: #ef4444;
      }
      .ed-dots span:nth-child(2) {
        background: #f59e0b;
      }
      .ed-dots span:nth-child(3) {
        background: #22c55e;
      }
      .ed-fn {
        font-family: var(--fm);
        font-size: 0.68rem;
        color: var(--t3);
      }
      .ed-acts {
        display: flex;
        gap: 6px;
      }
      .btn-run,
      .btn-rst {
        font-family: var(--fm);
        font-size: 0.68rem;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 5px;
        border: 0;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-run {
        background: var(--green);
        color: #000;
      }
      .btn-run:hover {
        background: #34d399;
      }
      .btn-run:disabled {
        background: var(--t3);
        cursor: wait;
      }
      .btn-rst {
        background: var(--b1);
        color: var(--t2);
      }
      .btn-rst:hover {
        background: var(--b2);
      }
      .ed-body {
        display: flex;
        min-height: 140px;
      }
      .ed-ln {
        padding: 12px 0;
        min-width: 36px;
        text-align: right;
        font-family: var(--fm);
        font-size: 0.75rem;
        line-height: 1.65;
        color: var(--t3);
        user-select: none;
        border-right: 1px solid var(--b1);
        background: rgba(255, 255, 255, 0.008);
      }
      .ed-ln div {
        padding: 0 8px;
      }
      .ed-ta {
        flex: 1;
        padding: 12px 14px;
        font-family: var(--fm);
        font-size: 0.8rem;
        line-height: 1.65;
        color: var(--t1);
        background: 0;
        border: 0;
        outline: 0;
        resize: vertical;
        min-height: 140px;
        tab-size: 4;
        white-space: pre;
        overflow-x: auto;
      }
      .out-c {
        border-top: 1px solid var(--b1);
        background: rgba(0, 0, 0, 0.2);
      }
      .out-h {
        padding: 6px 14px;
        font-family: var(--fm);
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--t3);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--b1);
      }
      .out-b {
        padding: 10px 14px;
        font-family: var(--fm);
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--t2);
        min-height: 40px;
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .out-b.err {
        color: var(--red);
      }
      .out-b.ok {
        color: var(--green);
      }
      .exblock {
        background: var(--bg3);
        border: 1px solid var(--b1);
        border-radius: 10px;
        padding: 24px;
        margin: 24px 0;
      }
      .exblock h3 {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--green);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .exblock .exd {
        font-size: 0.88rem;
        color: var(--t2);
        margin-bottom: 14px;
        line-height: 1.7;
      }
      .exblock .exd code {
        font-family: var(--fm);
        font-size: 0.78rem;
        background: var(--bg4);
        padding: 1px 5px;
        border-radius: 3px;
        color: var(--accent);
        border: 1px solid var(--b1);
      }
      .exres {
        margin-top: 10px;
        padding: 10px 14px;
        border-radius: 7px;
        font-family: var(--fm);
        font-size: 0.78rem;
        display: none;
      }
      .exres.pass {
        display: block;
        background: var(--greenD);
        border: 1px solid rgba(34, 197, 94, 0.25);
        color: var(--green);
      }
      .exres.fail {
        display: block;
        background: var(--redD);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: var(--red);
      }
      .les-nav {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid var(--b1);
        gap: 12px;
        flex-wrap: wrap;
      }
      .nbtn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        background: var(--bg3);
        border: 1px solid var(--b1);
        border-radius: 8px;
        color: var(--t2);
        font-family: var(--ff);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .nbtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .nbtn.pri {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
        font-weight: 600;
      }
      .nbtn.pri:hover {
        background: var(--accent2);
      }
      .ld-ov {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
        transition: opacity 0.4s;
      }
      .ld-ov.hid {
        opacity: 0;
        pointer-events: none;
      }
      .ld-sp {
        width: 36px;
        height: 36px;
        border: 3px solid var(--b1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: sp 0.7s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .ld-tx {
        margin-top: 14px;
        font-family: var(--fm);
        font-size: 0.78rem;
        color: var(--t3);
      }
      @keyframes fu {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fi {
        animation: fu 0.4s ease forwards;
      }
      @media (max-width: 900px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .main {
          margin-left: 0;
        }
        .ham {
          display: block;
        }
        .les {
          padding: 28px 16px;
        }
        .land {
          padding: 40px 16px;
        }
        .topbar-pbar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ld-ov" id="loader">
      <div class="ld-sp"></div>
      <div class="ld-tx">Cargando motores Python & SQL...</div>
    </div>

      async function run(eid, lang, isEx, lid) {
        const code = document.getElementById("c_" + eid).value,
          o = document.getElementById("o_" + eid),
          b = document.getElementById("rb_" + eid);
        b.disabled = true;
        b.textContent = "⏳...";
        o.textContent = "Ejecutando...";
        o.className = "out-b";
        let r = "",
          err = false;
        try {
          r = lang === "sql" ? await runSQL(code) : await runPy(code);
        } catch (e) {
          r = "Error: " + e.message;
          err = true;
        }
        o.textContent = r || "(sin salida)";
        o.className = "out-b" + (err ? " err" : "");
        b.disabled = false;
        b.textContent = "▶ Ejecutar";
        if (isEx && lid && !err) valEx(lid, r);
      }
      async function runPy(code) {
        if (!pyReady) return "⏳ Motor Python cargando...";
        pyInst.runPython("import sys,io;_c=io.StringIO();sys.stdout=_c");
        try {
          pyInst.runPython(code);
          return pyInst.runPython("_c.getvalue()");
        } catch (e) {
          return (
            e.message
              .split("\n")
              .filter((l) => !l.includes("pyodide") && !l.includes("wasm"))
              .join("\n") || e.message
          );
        } finally {
          pyInst.runPython("sys.stdout=sys.__stdout__");
        }
      }
      async function runSQL(code) {
        if (!sqlReady) return "⏳ Motor SQL cargando...";
        const SQL = await initSqlJs({
          locateFile: (f) =>
            "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/" + f,
        });
        const db = new SQL.Database();
        try {
          const stmts = code.split(";").filter((s) => s.trim());
          let out = "";
          for (const st of stmts) {
            const tr = st.trim();
            if (!tr || tr.startsWith("--")) continue;
            try {
              const res = db.exec(tr);
              for (const r of res) {
                const cw = r.columns.map((c, i) => {
                  const vs = r.values.map((row) => String(row[i]).length);
                  return Math.max(c.length, ...vs);
                });
                if (out) out += "\n\n";
                out +=
                  r.columns.map((c, i) => c.padEnd(cw[i])).join(" | ") +
                  "\n" +
                  cw.map((w) => "-".repeat(w)).join("-+-") +
                  "\n" +
                  r.values
                    .map((row) =>
                      row
                        .map((v, i) =>
                          String(v === null ? "NULL" : v).padEnd(cw[i])
                        )
                        .join(" | ")
                    )
                    .join("\n");
              }
            } catch (e) {
              if (out) out += "\n";
              out += "Error: " + e.message;
            }
          }
          db.close();
          return out || "(OK)";
        } catch (e) {
          db.close();
          throw e;
        }
      }
      function valEx(lid, output) {
        const al = allL(),
          les = al.find((l) => l.id === lid);
        if (!les) return;
        const ex = les.content.find((b) => b.t === "exercise");
        if (!ex) return;
        const rd = document.getElementById("res_" + lid);
        if (!rd) return;
        try {
          if (eval(ex.validator)) {
            rd.textContent = ex.ok;
            rd.className = "exres pass";
            done.add(lid);
            try {
              localStorage.setItem("yap_d", JSON.stringify([...done]));
            } catch (e) {}
            upProg();
            renderSB();
          } else {
            rd.textContent = ex.fail;
            rd.className = "exres fail";
          }
        } catch (e) {
          rd.textContent = ex.fail;
          rd.className = "exres fail";
        }
      }
    </script>
